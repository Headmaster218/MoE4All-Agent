<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MoE4All Agent</title><style>
:root{color-scheme:dark;--base:#1e1e1f;--surface:#303033;--text:#ededee;--muted:#c1c1c6;--faint:#b2b2b7;--border:#818187;--accent:#dedee2;--error:#f5a3aa}
*{box-sizing:border-box}body{margin:0;background:var(--base);color:var(--text);font:14px/1.6 "Segoe UI","Microsoft YaHei UI",sans-serif;letter-spacing:0}main{width:min(520px,100%);margin:auto;padding:44px 28px;min-height:100vh;display:flex;flex-direction:column;justify-content:center}.brand{font-size:16px;font-weight:600;margin-bottom:40px}h1{font-size:26px;line-height:1.4;margin:0 0 12px}p{margin:0;color:var(--muted)}.phase{display:flex;gap:12px;align-items:baseline;justify-content:space-between;margin-top:32px}.phase span:first-child{font-weight:600}.percent{white-space:nowrap;color:var(--faint);font-variant-numeric:tabular-nums}.track{height:6px;border-radius:3px;background:var(--surface);margin:12px 0;overflow:hidden}.fill{height:100%;border-radius:inherit;background:var(--accent);width:0;transition:width .2s}.indeterminate .fill{width:28%;animation:travel 1.6s ease-in-out infinite}@keyframes travel{from{transform:translateX(-110%)}to{transform:translateX(460%)}}.failed .fill{background:var(--error);width:100%}#detail{font-size:12px;color:var(--faint);overflow-wrap:anywhere}nav{display:flex;gap:18px;flex-wrap:wrap;margin-top:28px}button,summary{font:inherit;cursor:pointer;color:var(--muted);background:none;border:0;padding:4px 0}button:hover,summary:hover{color:var(--text)}button:focus-visible,summary:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:3px}details{margin-top:20px}summary{font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:var(--surface);border-radius:8px;padding:12px;font:12px/1.6 Consolas,monospace;max-height:180px;overflow:auto;margin:10px 0 0;color:var(--muted)}[hidden]{display:none!important}@media(max-height:580px){main{padding:24px 28px;justify-content:flex-start}.brand{margin-bottom:24px}h1{font-size:23px}.phase{margin-top:22px}}@media(prefers-reduced-motion:reduce){.fill{transition:none}.indeterminate .fill{animation:none;width:50%}}
</style></head><body><main aria-live="polite"><div class="brand">MoE4All Agent</div><h1 id="heading">MoE4All</h1><p id="explanation"></p><div class="phase"><span id="stage"></span><span class="percent" id="percent"></span></div><div class="track indeterminate" id="track" role="progressbar" aria-label="MoE4All"><div class="fill" id="fill"></div></div><p id="detail"></p><nav><button id="logs" onclick="command('log')"></button><button id="browser" hidden onclick="command('browser')"></button></nav><details id="details"><summary id="details-label"></summary><pre id="log"></pre></details></main><script>
function command(command){window.chrome?.webview?.postMessage({type:'moe4all-startup-command',command})}
window.setState=function(s){document.documentElement.lang=s.language;document.documentElement.style.colorScheme=s.theme==='white'?'light':'dark';for(const [key,color] of Object.entries(s.colors||{}))document.documentElement.style.setProperty('--'+key,color);for(const key of ['heading','explanation','stage','detail','percent','log'])document.getElementById(key).textContent=s[key]||'';document.getElementById('logs').textContent=s.logLabel;document.getElementById('browser').textContent=s.browserLabel;document.getElementById('browser').hidden=!s.failed;document.getElementById('details-label').textContent=s.detailsLabel;const track=document.getElementById('track');track.className='track'+(s.failed?' failed':s.progress==null?' indeterminate':'');if(s.progress!=null){const percent=Math.max(0,Math.min(100,s.progress));track.setAttribute('aria-valuenow',percent);track.setAttribute('aria-valuemax','100');document.getElementById('fill').style.width=percent+'%'}else{track.removeAttribute('aria-valuenow');document.getElementById('fill').style.width=''}if(s.failed)document.getElementById('details').open=true}
/*INITIAL_STATE*/
</script></body></html>
